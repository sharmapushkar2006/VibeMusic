<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> VibeMusic by Pushkar</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script type="module" src="js/app.js"></script>
    <!--Audio loader-->
   
    <!--Top Bar -->
    <div class="top-bar">
        <b>VibeMusic - Music based on mood !</b>
    </div>

    <!--Mood Selection Screen-->
    <section id="mood-screen" class="overlay">
        <div class="mood-content">
            <h1>How is your mood?</h1>
            <p>Let you's mood choose the perfect tracks for you!</p>
            <b style="font-size:11px;background-color:red;padding:2px 2px 2px 2px;border-radius:5px;">Only a short part of song will be played because i don't own the music.</b>
            
            <div class="mood-grid">
                <button class="mood-btn" id="hindi-btn">🇮🇳 Romantic Hits</button>
                <button class="mood-btn" id="punjabi-btn">🚜 Punjabi Swag</button>
                <button class="mood-btn" id="haryanvi-btn">🚜 Haryanvi Swag</button>
               <!--<button class="mood-btn" id="lofi-btn">💻 Focus / Lofi</button>-->
               <button class="mood-btn"onclick="window.open('https://instagram.com/puxhkar_s22')">Follow me on Instagram</button>
            </div>
            
        </div>
    </section>

    <!--Feed Screen-->
    <main id="app-feed" class="app-container hidden">
        
        <button id="back-btn"class="back-btn">← Change Mood</button>
        <img class="musicposter" id="music-poster" src="assets/images/covers/loading.gif" alt="Music Poster">
        <div id="feed-wrapper"class="feed-wrapper">
            <b id="music-name">Loading..</b>
            <br>
            <p id="artist-name">Loading...</p>
            <br>
             <audio id="audio-player" controls loop></audio>
        </div>
        <div class="arrow" id="next"></div>
    </main>

    
    

</body>
</html>
